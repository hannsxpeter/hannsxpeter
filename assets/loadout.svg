<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 404" width="1200" height="404" role="img" aria-labelledby="t d">
  <title id="t">Character Sheet and Loadout</title>
  <desc id="d">Character sheet and equipment loadout. Principles and 20 years tenure. Languages: TypeScript, Rust, Python, Bash. Runtime: Bun, SvelteKit, Astro, Convex, Docker. Daily drivers: Claude, MCP, Claude Code, Codex, Cursor.</desc>
  <style>
    .display{font-family:"Avenir Next","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <defs>
    <pattern id="loadDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#21272E"/>
    </pattern>
    <radialGradient id="trayWarm" cx="75%" cy="80%" r="36%">
      <stop offset="0%" stop-color="#17A87A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#111417" stop-opacity="0"/>
    </radialGradient>
    <filter id="trayShadow" x="-5%" y="-6%" width="110%" height="118%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="404" rx="16" fill="#111417"/>
  <rect width="1200" height="404" rx="16" fill="url(#loadDots)"/>
  <rect width="1200" height="404" rx="16" fill="url(#trayWarm)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="402.5" rx="15.25" fill="none" stroke="#272D34" stroke-width="1.5"/>

  <!-- Top Header Strip -->
  <path d="M1.5 46H1198.5V16A14.5 14.5 0 0 0 1184 1.5H16A14.5 14.5 0 0 0 1.5 16Z" fill="#161A1E"/>
  <line x1="1.5" y1="46" x2="1198.5" y2="46" stroke="#21272D" stroke-width="1"/>
  <rect x="28" y="13" width="76" height="20" rx="10" fill="#241F15" stroke="#4E4125" stroke-width="1"/>
  <text x="66" y="26.5" class="mono" font-size="10" font-weight="700" fill="#E6C785" text-anchor="middle" letter-spacing="1.1">LOADOUT</text>
  <text x="118" y="27" class="sans" font-size="12.5" font-weight="600" fill="#D6D3CB">Character sheet and daily tools</text>
  <text x="1172" y="27" class="mono" font-size="11.5" fill="#9099A3" text-anchor="end" letter-spacing="0.8">14 EQUIPPED</text>

  <!-- LEFT CARD: Principles & Tenure (x=28, y=68, w=340, h=312) -->
  <g transform="translate(28 68)" filter="url(#trayShadow)">
    <rect width="340" height="312" rx="12" fill="#181C21" stroke="#272D34" stroke-width="1.2"/>
    <text x="22" y="30" class="mono" font-size="10.5" font-weight="700" fill="#D8AE5E" letter-spacing="1.5">PRINCIPLES</text>
    <text x="318" y="30" class="mono" font-size="10.5" fill="#55C49E" text-anchor="end">20 YRS EXP</text>
    <line x1="22" y1="42" x2="318" y2="42" stroke="#21272D" stroke-width="1"/>

    <text x="22" y="68" class="display" font-size="17" font-weight="700" fill="#F4EFE6">Enterprise systems to AI</text>
    <text x="22" y="90" class="sans" font-size="12.5" fill="#9099A3">20 years in data and analytics. Full-time AI.</text>

    <!-- 4 Refined Pill Meters -->
    <g transform="translate(22 118)">
