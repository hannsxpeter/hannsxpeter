  <title id="t">Character Sheet and Loadout</title>
  <desc id="d">Tactical loadout screen. Pilot profile with 20 years experience and core doctrine meters. Primary languages: TypeScript, Rust, Python, Bash. Runtime rig: Bun, SvelteKit, Astro, Convex, Docker. Co-op daily drivers: Claude, MCP, Claude Code, Codex, Cursor.</desc>
