      <text x="296" y="40" class="mono" font-size="10.5" fill="#6BC799" text-anchor="end">over hope</text>
      <rect x="0" y="49" width="296" height="6" rx="3" fill="#20262C"/><rect x="0" y="49" width="296" height="6" rx="3" fill="#6BC799"/>

      <text x="0" y="80" class="sans" font-size="12" font-weight="600" fill="#F4EFE6">Audit trail</text>
      <text x="296" y="80" class="mono" font-size="10.5" fill="#E6C785" text-anchor="end">checkable</text>
      <rect x="0" y="89" width="296" height="6" rx="3" fill="#20262C"/><rect x="0" y="89" width="296" height="6" rx="3" fill="#D8AE5E"/>

