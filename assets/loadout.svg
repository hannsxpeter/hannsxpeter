    <g transform="translate(139 42)"><rect width="110" height="52" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#E37A59"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">SvelteKit</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Web apps</text></g>
    <g transform="translate(259 42)"><rect width="109" height="52" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#B48BE0"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Astro</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Fast sites</text></g>
    <g transform="translate(20 102)"><rect width="169" height="52" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#DC6B67"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Convex</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Reactive backend</text></g>
    <g transform="translate(199 102)"><rect width="169" height="52" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#5AA8E6"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Docker</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Own your infra</text></g>
  </g>

