      <text x="296" y="0" class="mono" font-size="10.5" fill="#55C49E" text-anchor="end">over vibes</text>
      <rect x="0" y="9" width="296" height="6" rx="3" fill="#20262C"/><rect x="0" y="9" width="296" height="6" rx="3" fill="#17A87A"/>

