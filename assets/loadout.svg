    <g transform="translate(20 102)"><rect width="162" height="52" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#6EA8CE"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Python</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">AI &amp; data</text></g>
    <g transform="translate(194 102)"><rect width="162" height="52" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#6FBE68"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Bash</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Hooks &amp; glue</text></g>
  </g>

