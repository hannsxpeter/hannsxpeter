    <text x="20" y="27" class="mono" font-size="10.5" font-weight="700" fill="#55C49E" letter-spacing="1.5">DAILY DRIVERS  ·  AGENT LAYER</text>
    <text x="764" y="27" class="mono" font-size="10" fill="#9099A3" text-anchor="end">Where the packages run</text>

    <g transform="translate(20 42)"><rect width="138" height="56" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#DE8F72"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Claude</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Core model</text></g>
    <g transform="translate(168 42)"><rect width="138" height="56" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#9D91D9"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">MCP</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Tool protocol</text></g>
    <g transform="translate(316 42)"><rect width="152" height="56" rx="8" fill="#132922" stroke="#17A87A" stroke-width="1.4"/><circle cx="15" cy="20" r="3.5" fill="#55C49E"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Claude Code</text><text x="15" y="42" class="sans" font-size="11.5" fill="#55C49E">Primary cockpit</text></g>
    <g transform="translate(478 42)"><rect width="138" height="56" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#F4EFE6"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Codex</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Build &amp; review</text></g>
    <g transform="translate(626 42)"><rect width="138" height="56" rx="8" fill="#121519" stroke="#272D34" stroke-width="1"/><circle cx="15" cy="20" r="3.5" fill="#B8C4CE"/><text x="26" y="24" class="sans" font-size="13.5" font-weight="700" fill="#F4EFE6">Cursor</text><text x="15" y="42" class="sans" font-size="11.5" fill="#9099A3">Fast edits</text></g>
