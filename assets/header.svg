<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" width="1200" height="248" role="img" aria-labelledby="t d">
  <title id="t">Hanns Peter - AI Engineer &amp; Developer Infrastructure</title>
  <desc id="d">Hanns Peter. AI engineer building agentic systems, MCP servers, and developer infrastructure. Creator of Godpowers, Mythify, and Scriveno. 20+ years in enterprise systems, data, and AI. Ottawa, Canada.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <defs>
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#151C24" stroke-width="1"/>
    </pattern>
    <radialGradient id="topGlow" cx="18%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#17A87A" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Card -->
  <rect width="1200" height="248" rx="12" fill="#0D1117"/>
  <rect width="1200" height="248" rx="12" fill="url(#subtleGrid)"/>
  <rect width="1200" height="248" rx="12" fill="url(#topGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="246.5" rx="11.25" fill="none" stroke="#242D38" stroke-width="1.5"/>

  <!-- Left Subtle Vertical Accent Bar -->
  <rect x="0.75" y="28" width="3.5" height="192" rx="1.75" fill="#17A87A"/>

  <!-- Left Identity Column -->
  <g transform="translate(44 36)">
    <text x="0" y="14" class="mono" font-size="11.5" font-weight="600" fill="#3CC499" letter-spacing="1.8">OTTAWA, CANADA  ·  AI SYSTEMS &amp; DEVELOPER INFRASTRUCTURE</text>

    <text x="0" y="66" class="sans" font-size="44" font-weight="700" fill="#F3F6FA" letter-spacing="-0.8">Hanns Peter</text>

    <text x="0" y="104" class="sans" font-size="18.5" font-weight="500" fill="#D2DAE4">AI engineer building agentic systems, MCP servers,</text>
    <text x="0" y="130" class="sans" font-size="18.5" font-weight="500" fill="#D2DAE4">and developer infrastructure.</text>

    <text x="0" y="166" class="mono" font-size="12.5" fill="#8B97A6">Creator of Godpowers, Mythify, and Scriveno  ·  TypeScript · Rust · Python · Bun · Convex</text>
  </g>

  <!-- Right Executive Snapshot Panel -->
  <g transform="translate(756 26)">
    <rect width="412" height="196" rx="10" fill="#131922" stroke="#242D38" stroke-width="1.2"/>

    <text x="20" y="28" class="mono" font-size="10.5" font-weight="700" fill="#8B97A6" letter-spacing="1.6">PROFILE SNAPSHOT</text>
    <line x1="20" y1="40" x2="392" y2="40" stroke="#1E2630" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="20" y="66" class="mono" font-size="11" fill="#606C7A">EXPERIENCE</text>
    <text x="392" y="66" class="sans" font-size="13" font-weight="600" fill="#F3F6FA" text-anchor="end">20+ yrs enterprise systems, data &amp; AI</text>
    <line x1="20" y1="78" x2="392" y2="78" stroke="#1E2630" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="20" y="102" class="mono" font-size="11" fill="#606C7A">CURRENT</text>
    <text x="392" y="102" class="sans" font-size="13" font-weight="600" fill="#F3F6FA" text-anchor="end">Founder &amp; Principal, Sharetact</text>
    <line x1="20" y1="114" x2="392" y2="114" stroke="#1E2630" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="20" y="138" class="mono" font-size="11" fill="#606C7A">OPEN SOURCE</text>
    <text x="392" y="138" class="sans" font-size="13" font-weight="600" fill="#3CC499" text-anchor="end">14 npm packages (@hxp-tools) + Rust</text>
    <line x1="20" y1="150" x2="392" y2="150" stroke="#1E2630" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="20" y="175" class="mono" font-size="11" fill="#606C7A">FOCUS</text>
    <text x="392" y="175" class="sans" font-size="13" font-weight="600" fill="#D2DAE4" text-anchor="end">Agentic reliability, MCP, verification</text>
  </g>
</svg>
