<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Hanns Peter</title>
  <desc id="d">Arcade title screen. HANNS PETER wordmark, tagline AI engineer building the infrastructure around AI agents, 14 packages on npm under @hxp-tools, and a select-player panel with AGENT and FOUNDER.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .display{font-family:Newsreader,Georgia,"Times New Roman",serif}
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#152018" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#17A87A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0E1217" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="#0E1217"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="none" stroke="#24302A"/>

  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#151B18"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#24302A"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#E8B84A" letter-spacing="1.5">1UP</text>
  <text x="78" y="28" class="mono" font-size="13" font-weight="700" fill="#E8E2D6" letter-spacing="1.5">HANNS</text>
  <text x="600" y="28" class="mono" font-size="13" font-weight="700" fill="#17A87A" text-anchor="middle" letter-spacing="1.5">HI-SCORE: 14 PACKAGES</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#7F8BA3" text-anchor="end" letter-spacing="1.5">CREDIT 01</text>

  <text x="56" y="108" class="mono" font-size="14" font-weight="700" fill="#E8B84A" letter-spacing="4">@HXP-TOOLS / OPEN SOURCE</text>
  <text x="56" y="188" class="display" font-size="72" font-weight="600" fill="#F4EFE4">HANNS PETER</text>
  <text x="56" y="236" class="sans" font-size="22" font-weight="600" fill="#E8E2D6">AI engineer building the infrastructure</text>
  <text x="56" y="268" class="sans" font-size="22" font-weight="600" fill="#A8B0C0">around AI agents.</text>

  <text x="56" y="318" class="mono" font-size="12" font-weight="700" fill="#E8B84A" letter-spacing="2">PRESS START</text>
  <rect x="56" y="330" width="460" height="44" fill="#10261E" stroke="#17A87A" stroke-width="2"/>
  <text x="74" y="358" class="mono" font-size="17" font-weight="700" fill="#17A87A">&gt; npm i @hxp-tools/*</text>
  <rect x="470" y="343" width="11" height="19" fill="#17A87A">
    <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="400" class="mono" font-size="12" fill="#7F8BA3" letter-spacing="1.5">EVIDENCE OVER VIBES / GATES OVER HOPE / SHIPPED, NOT THEORETICAL</text>

  <!-- Select player panel -->
  <g transform="translate(700 78)">
    <rect x="0" y="0" width="440" height="280" rx="8" fill="#12181A" stroke="#2A3A34" stroke-width="2"/>
    <text x="220" y="36" class="mono" font-size="13" font-weight="700" fill="#E8B84A" text-anchor="middle" letter-spacing="2">SELECT PLAYER</text>

    <rect x="28" y="56" width="180" height="150" rx="6" fill="#0E1217" stroke="#17A87A" stroke-width="2"/>
    <text x="118" y="88" class="mono" font-size="11" font-weight="700" fill="#17A87A" text-anchor="middle" letter-spacing="1.5">P1</text>
    <!-- robot head -->
    <rect x="78" y="100" width="80" height="56" rx="4" fill="#1A2E28" stroke="#17A87A"/>
    <rect x="92" y="116" width="18" height="14" fill="#17A87A"/>
    <rect x="126" y="116" width="18" height="14" fill="#17A87A"/>
    <rect x="100" y="140" width="36" height="6" fill="#E8B84A"/>
    <text x="118" y="184" class="mono" font-size="14" font-weight="700" fill="#F4EFE4" text-anchor="middle">AGENT</text>

    <rect x="232" y="56" width="180" height="150" rx="6" fill="#0E1217" stroke="#2A3A34" stroke-width="2"/>
    <text x="322" y="88" class="mono" font-size="11" font-weight="700" fill="#7F8BA3" text-anchor="middle" letter-spacing="1.5">P2</text>
    <!-- founder mark: HP monogram block -->
    <rect x="282" y="100" width="80" height="56" rx="4" fill="#1A2228" stroke="#7F8BA3"/>
    <text x="322" y="136" class="sans" font-size="28" font-weight="800" fill="#E8E2D6" text-anchor="middle">HP</text>
    <text x="322" y="184" class="mono" font-size="14" font-weight="700" fill="#A8B0C0" text-anchor="middle">FOUNDER</text>

    <text x="220" y="240" class="mono" font-size="12" fill="#7F8BA3" text-anchor="middle" letter-spacing="1">SHARETACT + OPEN TOOLING</text>
    <text x="220" y="262" class="mono" font-size="12" font-weight="700" fill="#17A87A" text-anchor="middle" letter-spacing="1">WORLD MAP UNLOCKED</text>
  </g>
</svg>
