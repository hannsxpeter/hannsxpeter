<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="t d">
  <title id="t">Hanns Peter</title>
  <desc id="d">Collector edition game title card for Hanns Peter. AI engineer building agentic systems, MCP servers, and dev infrastructure. Creator of Godpowers, Scriveno, Mythify. TypeScript, Python, Rust, Bun, Convex. Ottawa, Canada.</desc>
  <style>
    .display{font-family:"Avenir Next","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes gentleBreath{0%,100%{opacity:0.95}50%{opacity:0.35}}
    .cursor{animation:gentleBreath 1.4s ease-in-out infinite}
  </style>
  <defs>
    <pattern id="linen" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#232930" fill-opacity="0.7"/>
    </pattern>
    <radialGradient id="warmAura" cx="78%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#17A87A" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#D8AE5E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#111417" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cartShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272E35"/>
      <stop offset="100%" stop-color="#1A1F24"/>
    </linearGradient>
    <linearGradient id="labelArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142923"/>
      <stop offset="55%" stop-color="#101B1B"/>
      <stop offset="100%" stop-color="#1D1B14"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBD095"/>
      <stop offset="100%" stop-color="#B88B3B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="410" rx="16" fill="#111417"/>
  <rect width="1200" height="410" rx="16" fill="url(#linen)"/>
  <rect width="1200" height="410" rx="16" fill="url(#warmAura)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="408.5" rx="15.25" fill="none" stroke="#272D34" stroke-width="1.5"/>

  <!-- Subtle Header Strip -->
  <path d="M1.5 46H1198.5V16A14.5 14.5 0 0 0 1184 1.5H16A14.5 14.5 0 0 0 1.5 16Z" fill="#161A1E"/>
  <line x1="1.5" y1="46" x2="1198.5" y2="46" stroke="#21272D" stroke-width="1"/>

  <!-- Header Content -->
  <rect x="28" y="13" width="66" height="20" rx="10" fill="#241F15" stroke="#4E4125" stroke-width="1"/>
  <text x="61" y="26.5" class="mono" font-size="10" font-weight="700" fill="#E6C785" text-anchor="middle" letter-spacing="1.1">PLAYER 1</text>
  <text x="108" y="27" class="sans" font-size="12.5" font-weight="600" fill="#D6D3CB">Hanns Peter</text>

  <text x="600" y="27" class="mono" font-size="11.5" fill="#9099A3" text-anchor="middle" letter-spacing="1">14 PACKAGES ON @HXP-TOOLS  ·  8 WORLDS</text>

  <text x="1172" y="27" class="mono" font-size="11.5" fill="#9099A3" text-anchor="end" letter-spacing="0.8">OTTAWA, CANADA  ·  20 YRS EXP</text>

  <!-- Left Editorial Stage -->
  <g transform="translate(56 88)">
    <!-- Quiet Eyebrow -->
    <circle cx="5" cy="5" r="3.5" fill="#17A87A"/>
    <text x="18" y="9" class="mono" font-size="11.5" font-weight="600" fill="#D8AE5E" letter-spacing="2">COLLECTOR EDITION  ·  @HXP-TOOLS</text>

    <!-- Refined Bold Display Wordmark -->
    <text x="0" y="76" class="display" font-size="60" font-weight="800" fill="#F4EFE6" letter-spacing="-1.2">Hanns Peter</text>

    <!-- Warm brass & emerald craft rule -->
    <rect x="0" y="96" width="56" height="3" rx="1.5" fill="#17A87A"/>
    <rect x="64" y="96" width="18" height="3" rx="1.5" fill="#D8AE5E"/>

    <!-- Bio Copy -->
    <text x="0" y="136" class="display" font-size="20" font-weight="500" fill="#F4EFE6">AI engineer building agentic systems, MCP servers,</text>
    <text x="0" y="164" class="display" font-size="20" font-weight="500" fill="#F4EFE6">and dev infrastructure.</text>

    <text x="0" y="198" class="sans" font-size="13.5" fill="#9099A3">Creator of Godpowers, Scriveno, Mythify  ·  TypeScript, Python, Rust, Bun, Convex</text>

    <!-- Polished Press-Start Command Bar -->
    <g transform="translate(0 222)">
      <rect width="588" height="48" rx="10" fill="#121519" stroke="#245445" stroke-width="1.4"/>
      <rect x="7" y="7" width="84" height="34" rx="7" fill="#17A87A"/>
      <text x="49" y="28.5" class="mono" font-size="11.5" font-weight="700" fill="#0B1612" text-anchor="middle" letter-spacing="1.2">START</text>
      <text x="110" y="29" class="mono" font-size="15" font-weight="600" fill="#F4EFE6">npx @hxp-tools/godpowers</text>
      <rect x="336" y="16" width="8" height="16" rx="1.5" fill="#55C49E" class="cursor"/>
      <text x="570" y="28.5" class="mono" font-size="11" fill="#9099A3" text-anchor="end">exit 0 only</text>
    </g>

    <!-- Quiet Footer Line -->
    <text x="0" y="296" class="sans" font-size="12.5" fill="#636D77">Active quest: Founder &amp; Principal Consultant at Sharetact</text>
  </g>

  <!-- Right Stage: Tactile Collector's Game Cartridge -->
  <g transform="translate(766 72)" filter="url(#cardShadow)">
    <!-- Cartridge Silhouette (classic handheld cartridge with notched top-right corner) -->
    <path d="M16 0 H334 L374 36 V294 A16 16 0 0 1 358 310 H16 A16 16 0 0 1 0 294 V16 A16 16 0 0 1 16 0 Z" fill="url(#cartShell)" stroke="#353E47" stroke-width="1.5"/>
    <!-- Subtle inner specular rim -->
    <path d="M16 1.5 H333 L372.5 36.8 V294 A14.5 14.5 0 0 1 358 308.5 H16 A14.5 14.5 0 0 1 1.5 294 V16 A14.5 14.5 0 0 1 16 1.5 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Moulded tactile grip grooves on top -->
    <rect x="28" y="14" width="276" height="4" rx="2" fill="#15191D"/>
    <rect x="28" y="24" width="276" height="4" rx="2" fill="#15191D"/>
    <rect x="28" y="34" width="276" height="4" rx="2" fill="#15191D"/>

    <!-- Recessed Sticker Label Well -->
    <rect x="24" y="54" width="326" height="202" rx="10" fill="url(#labelArt)" stroke="#2F3B3A" stroke-width="1.4"/>
    <!-- Decorative fine gold inner frame on sticker -->
    <rect x="32" y="62" width="310" height="186" rx="6" fill="none" stroke="#D8AE5E" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Subtle circular craft watermark inside sticker -->
    <circle cx="187" cy="144" r="68" fill="none" stroke="#17A87A" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="187" cy="144" r="52" fill="none" stroke="#D8AE5E" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Sticker Top Metadata -->
    <text x="46" y="84" class="mono" font-size="9.5" font-weight="700" fill="#E6C785" letter-spacing="1.6">HXP-001</text>
    <text x="328" y="84" class="mono" font-size="9.5" font-weight="700" fill="#55C49E" text-anchor="end" letter-spacing="1.4">8 WORLDS</text>

    <!-- Crafted Heraldic Gate Crest (Shield + Proof Checkmark + Crown Point) -->
    <g transform="translate(151 98)">
      <!-- Small top star/diamond crown -->
      <polygon points="36,-11 39.5,-7 36,-3 32.5,-7" fill="#E6C785"/>
      <!-- Shield outer gold frame -->
      <path d="M36 4 L66 15 V38 C66 57 53 71 36 78 C19 71 6 57 6 38 V15 Z" fill="#122721" stroke="url(#goldSheen)" stroke-width="2.4"/>
      <!-- Inner emerald bevel -->
      <path d="M36 11 L59 19.5 V37.5 C59 52.5 49 63.5 36 69.5 C23 63.5 13 52.5 13 37.5 V19.5 Z" fill="#17382E" stroke="#17A87A" stroke-width="1.2"/>
      <!-- Crisp verification checkmark inside crest -->
      <path d="M24 39 L33 48 L50 29" fill="none" stroke="#F4EFE6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Sticker Title & Subtitle -->
    <text x="187" y="202" class="display" font-size="22" font-weight="800" fill="#F4EFE6" text-anchor="middle" letter-spacing="2.2">GODPOWERS</text>
    <text x="187" y="222" class="mono" font-size="10.5" fill="#55C49E" text-anchor="middle" letter-spacing="1.4">EVIDENCE OVER VIBES</text>
    <text x="187" y="238" class="mono" font-size="9.5" fill="#9099A3" text-anchor="middle" letter-spacing="1">14 TOOLS  ·  ZERO GUESSWORK</text>

    <!-- Moulded Bottom Cartridge Grip & Classic Directional Insert Triangle -->
    <polygon points="187,294 176,274 198,274" fill="#14181C" stroke="#2D343C" stroke-width="1"/>
    <text x="32" y="288" class="mono" font-size="9.5" fill="#636D77" letter-spacing="1.2">SEAL OF QUALITY</text>
    <text x="342" y="288" class="mono" font-size="9.5" fill="#636D77" text-anchor="end" letter-spacing="1.2">EXIT 0</text>
  </g>
</svg>
